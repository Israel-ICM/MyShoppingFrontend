<button
  type="button"
  class="filter-select__trigger"
  [class.filter-select__trigger--open]="open()"
  [class.filter-select__trigger--has-value]="selectedId() !== null"
  [disabled]="disabled()"
  (click)="toggle()"
>
  <span>{{ selectedLabel() }}</span>
  <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
    <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </svg>
</button>

@if (open()) {
  <div class="filter-select__panel">
    <input
      type="text"
      class="filter-select__search"
      placeholder="Buscar…"
      [value]="busqueda()"
      (input)="onBusquedaInput($any($event.target).value)"
      (click)="$event.stopPropagation()"
      autofocus
    />
    <ul class="filter-select__options">
      <li
        class="filter-select__option"
        [class.filter-select__option--selected]="selectedId() === null"
        (click)="select(null)"
      >
        {{ placeholder }}
      </li>
      @for (option of opcionesFiltradas(); track option.id) {
        <li
          class="filter-select__option"
          [class.filter-select__option--selected]="selectedId() === option.id"
          (click)="select(option.id)"
        >
          {{ option.nombre }}
        </li>
      }
      @if (!opcionesFiltradas().length) {
        <li class="filter-select__empty">Sin resultados</li>
      }
    </ul>
  </div>
}
