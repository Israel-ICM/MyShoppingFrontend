<div class="login-page">
  <button
    type="button"
    class="theme-toggle"
    (click)="toggleTheme()"
    [attr.aria-label]="theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
  >
    @if (theme() === 'dark') {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6" />
        <path
          d="M12 2.5v2.3M12 19.2v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a7.1 7.1 0 1 0 10.6 10.6Z" />
      </svg>
    }
  </button>

  <div class="login-wrapper">
    <div class="login-card">
      <h1 class="sr-only">Iniciar sesión</h1>
      <app-logo class="login-card__logo" style="--logo-size: 180px" />
      <p class="login-card__subtitle">Panel de control</p>

      @if (errorMessage()) {
        <p class="login-form__error" role="alert">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 7.5v5.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="12" cy="16.3" r="0.9" fill="currentColor" />
          </svg>
          <span>{{ errorMessage() }}</span>
        </p>
      }

      <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="login-form__field">
          <label for="username">Usuario</label>
          <div class="login-form__input-wrapper" [class.login-form__input-wrapper--error]="isInvalid('username')">
            <svg class="login-form__input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M4 20.5c1.2-3.7 4.4-6 8-6s6.8 2.3 8 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <input
              id="username"
              type="text"
              formControlName="username"
              autocomplete="username"
              placeholder="admin@myshopping.es"
              [attr.aria-invalid]="isInvalid('username')"
              [attr.aria-describedby]="isInvalid('username') ? 'username-error' : null"
            />
          </div>
          @if (isInvalid('username')) {
            <p id="username-error" class="login-form__field-error" role="alert">
              El usuario es obligatorio.
            </p>
          }
        </div>

        <div class="login-form__field">
          <label for="password">Contraseña</label>
          <div class="login-form__input-wrapper" [class.login-form__input-wrapper--error]="isInvalid('password')">
            <svg class="login-form__input-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="1.6" />
              <path d="M8 11V7.5a4 4 0 0 1 8 0V11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            </svg>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              placeholder="••••••••"
              [attr.aria-invalid]="isInvalid('password')"
              [attr.aria-describedby]="isInvalid('password') ? 'password-error' : null"
            />
            <button
              type="button"
              class="login-form__toggle-pass"
              tabindex="-1"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              @if (showPassword()) {
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M3 3l18 18M10.6 10.6a2.5 2.5 0 0 0 3.5 3.5M9.4 5.3A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.1 3.9M6.3 6.6C4 8.2 2 11 2 11a15.8 15.8 0 0 0 5.4 5.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              } @else {
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                </svg>
              }
            </button>
          </div>
          @if (isInvalid('password')) {
            <p id="password-error" class="login-form__field-error" role="alert">
              La contraseña es obligatoria.
            </p>
          }
        </div>

        <button
          type="submit"
          class="login-form__submit"
          [class.login-form__submit--loading]="loading()"
          [disabled]="form.invalid || loading()"
        >
          @if (loading()) {
            <span class="login-form__spinner" aria-hidden="true"></span>
          }
          {{ loading() ? 'Ingresando…' : 'Iniciar sesión' }}
        </button>

        <div class="login-form__divider">acceso restringido</div>
      </form>
    </div>
  </div>
</div>
