<div class="sidebar-overlay" [class.sidebar-overlay--visible]="sidebarOpen()" (click)="closeSidebar()"></div>

<aside class="sidebar" [class.sidebar--open]="sidebarOpen()">
  <div class="sidebar__brand">
    <app-logo style="--logo-size: 140px" />
  </div>

  <nav class="sidebar__nav">
    <span class="sidebar__label">Menú</span>

    @for (item of navItems; track item.path) {
      <a
        class="sidebar__link"
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: item.path === '/' }"
        (click)="closeSidebar()"
      >
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          @switch (item.icon) {
            @case ('dashboard') {
              <path d="M4 13.5 12 4l8 9.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M6 12v7a1 1 0 0 0 1 1h3v-5h4v5h3a1 1 0 0 0 1-1v-7" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            }
            @case ('compras') {
              <path d="M3 6h18l-1.5 9.5a2 2 0 0 1-2 1.5H6.5a2 2 0 0 1-2-1.5L3 6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M8 6V5a4 4 0 0 1 8 0v1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            }
            @case ('inventario') {
              <path d="M3 9.5 12 4l9 5.5V19a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1V9.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            }
            @case ('pedidos') {
              <path d="M3 7h11v8H3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <path d="M14 10h4l3 3v2h-7z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
              <circle cx="7" cy="18" r="1.6" stroke="currentColor" stroke-width="1.6" />
              <circle cx="17" cy="18" r="1.6" stroke="currentColor" stroke-width="1.6" />
            }
            @case ('usuarios') {
              <circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.6" />
              <path d="M3 20c.8-4 3-6.2 6-6.2s5.2 2.2 6 6.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <path d="M15.5 6.2c1.7.3 3 1.8 3 3.6s-1.3 3.3-3 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              <path d="M16.5 13.9c2 .6 3.5 2.4 4 5.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            }
            @case ('reportes') {
              <path d="M5 20V10M11 20V4M17 20v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            }
          }
        </svg>
        {{ item.label }}
      </a>
    }

    <span class="sidebar__label">Reportes</span>
    @for (item of reportItems; track item.path) {
      <a
        class="sidebar__link"
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        (click)="closeSidebar()"
      >
        <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 20V10M11 20V4M17 20v-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
        {{ item.label }}
      </a>
    }

    <button type="button" class="sidebar__link sidebar__link--logout" (click)="logout()">
      <svg class="sidebar__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        <path d="M15 16l4-4-4-4M9 12h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      Cerrar sesión
    </button>
  </nav>

  <div class="sidebar__user">
    <span class="sidebar__avatar">{{ (authService.username() ?? 'U').charAt(0).toUpperCase() }}</span>
    <div class="sidebar__user-info">
      <span class="sidebar__user-name">{{ authService.username() ?? 'Usuario' }}</span>
      <span class="sidebar__user-role">Administrador</span>
    </div>
  </div>
</aside>

<div class="shell">
  <header class="topbar">
    <div class="topbar__left">
      <button type="button" class="topbar__toggle" (click)="toggleSidebar()" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <h1 class="topbar__title">Panel de control</h1>
    </div>

    <button
      type="button"
      class="topbar__toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro'"
    >
      @if (themeService.theme() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12 2.5v2.3M12 19.2v2.3M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.5 12h2.3M19.2 12h2.3M4.4 19.6l1.6-1.6M18 6l1.6-1.6"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20 14.6A8.5 8.5 0 0 1 9.4 4a7.1 7.1 0 1 0 10.6 10.6Z" />
        </svg>
      }
    </button>
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
